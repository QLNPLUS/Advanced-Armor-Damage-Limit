buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

repositories {
    // Resolve the local artifact under the version exposed by its Forge metadata.
    ivy {
        url = rootProject.file('libs')
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
    }
}

version = mod_version
group = mod_group_id
base { archivesName = 'advanced-armor-damage-limit-forge-1.19.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                advancedarmordamagelimit {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', 'advancedarmordamagelimit', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'advancedarmordamagelimit.refmap.json'
    config 'advancedarmordamagelimit.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java.srcDir rootProject.file('common/forge/src/main/java')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.1') {
        artifact { name = 'YiRanExpressionLib-1.0.1-universal' }
    }
    jarJar(expressionLib)

    project.extensions.getByName('jarJar').versionInformation {
        ranged(dependency(expressionLib), '[1.0.1]')
    }
}

tasks.named('build') {
    dependsOn 'reobfJarJar'
}

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Parchment'; url = 'https://maven.parchmentmc.org' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

rootProject.name = 'ArmorDamageLimit'

def targetProjects = [
        'forge-1.19.2',
        'forge-1.20.1',
        'neoforge-1.21.1',
        'neoforge-26.1.2',
        'fabric-1.21.1'
]
def requestedProjects = targetProjects.findAll { target ->
    gradle.startParameter.taskNames.any { taskName ->
        taskName == ':' + target || taskName.startsWith(':' + target + ':')
    }
}
(requestedProjects ?: targetProjects).each { target ->
    include ':' + target
}

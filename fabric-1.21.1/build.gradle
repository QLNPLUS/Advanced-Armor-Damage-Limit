plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
    id 'idea'
}

version = fabric_version
group = mod_group_id
base { archivesName = 'advanced-armor-damage-limit-fabric-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.0-universal:universal')
    include(expressionLib)
}

loom {
    mixin {
        defaultRefmapName = 'advancedarmordamagelimit.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}



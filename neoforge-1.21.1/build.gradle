plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = 'advanced-armor-damage-limit-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir rootProject.file('common/neoforge-1.21.1/src/main/java')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

    maven { url = 'https://jitpack.io' }
}

dependencies {
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.0-universal:universal')
    jarJar(expressionLib)

    project.extensions.getByName('jarJar').versionInformation {
        ranged(dependency(expressionLib), '[1.0.0-universal]')
    }
}



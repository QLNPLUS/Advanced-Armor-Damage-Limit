plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

def targetProperties = new Properties()
file('gradle.properties').withInputStream { targetProperties.load(it) }
targetProperties.each { propertyName, propertyValue -> project.ext.set(propertyName, propertyValue) }

version = neo_version
group = mod_group_id
base { archivesName = 'ArmorDamageLimit-NeoForge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    enable {
        version = neo_version
        disableRecompilation = true
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir rootProject.file('common/neoforge-26.1.2/src/main/java')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The bundled local artifact declares Minecraft 1.21.1 metadata. Compile against its API,
    // but keep only the expression classes in this 26.1.2 jar until a native artifact exists.
    compileOnly files(rootProject.file('libs/YiRanExpressionLib-1.0.0-universal.jar'))
}

tasks.named('jar', Jar).configure {
    from {
        zipTree(rootProject.file('libs/YiRanExpressionLib-1.0.0-universal.jar'))
    } {
        exclude 'META-INF/**'
        exclude 'pack.mcmeta'
        exclude 'net/yiran/expressionlib/YiRanExpressionLib.class'
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

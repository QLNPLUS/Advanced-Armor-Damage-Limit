buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

repositories {
    // Resolve the local artifact under the version exposed by its Forge metadata.
    ivy {
        url = rootProject.file('libs')
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
    }
}

version = mod_version
group = mod_group_id
base { archivesName = 'advanced-armor-damage-limit-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                advancedarmordamagelimit {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'advancedarmordamagelimit'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', 'advancedarmordamagelimit', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'advancedarmordamagelimit.refmap.json'
    config 'advancedarmordamagelimit.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java {
    srcDir rootProject.file('common/forge/src/main/java')
    exclude 'com/rinko1231/armordamagelimit/mixin/ArmorDurabilityMixin.java'
}

tasks.named('compileJava', JavaCompile).configure {
    source rootProject.file('common/forge-1.20.1/src/main/java/com/rinko1231/armordamagelimit/mixin/ArmorDurabilityMixin.java')
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.1') {
        artifact { name = 'YiRanExpressionLib-1.0.1-universal' }
    }
    jarJar(expressionLib)

    project.extensions.getByName('jarJar').versionInformation {
        ranged(dependency(expressionLib), '[1.0.1]')
    }
}

tasks.named('build') {
    dependsOn 'reobfJarJar'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF/licenses/advanced-armor-damage-limit'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('licenses/YiRanExpressionLib-LICENSE.txt')) {
        into 'META-INF/licenses/yiran-expression-lib'
    }
    from(rootProject.file('licenses/ArmorDamageLimit-MIT-LICENSE.txt')) {
        into 'META-INF/licenses/armor-damage-limit-original'
    }
}

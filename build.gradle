plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

repositories {
    ivy {
        url = rootProject.file('libs')
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
    }
}

def targetProperties = new Properties()
file('gradle.properties').withInputStream { targetProperties.load(it) }
targetProperties.each { propertyName, propertyValue -> project.ext.set(propertyName, propertyValue) }

version = mod_version
group = mod_group_id
base { archivesName = 'advanced-armor-damage-limit-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.disableRefMap', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir 'src/main/java'

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    def expressionLib = implementation('com.github.yiran1457:YiRanExpressionLib:1.0.1') {
        artifact { name = 'YiRanExpressionLib-1.0.1-universal' }
    }
    jarJar(expressionLib) {
        version {
            strictly '[1.0.1]'
            prefer '1.0.1'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

def neoformMappingsDir = file("${gradle.gradleUserHomeDir}/caches/neoformruntime/intermediate_results")
def neoformMappingCandidates = fileTree(neoformMappingsDir) {
    include 'mergeMappings*_output.tsrg'
}
def mixinMappingsFile = layout.buildDirectory.file('mappings/advancedarmordamagelimit-mixin.tsrg')

def generateMixinMappings = tasks.register('generateMixinMappings') {
    inputs.files neoformMappingCandidates
    outputs.file mixinMappingsFile
    dependsOn tasks.named('createMinecraftArtifacts')
    doLast {
        def inputCandidates = fileTree(neoformMappingsDir) {
            include 'mergeMappings*_output.tsrg'
        }.files
        if (inputCandidates.isEmpty()) {
            throw new GradleException('NeoForm Mixin mappings were not generated.')
        }
        def inputFile = inputCandidates.max { it.lastModified() }
        def lines = inputFile.readLines('UTF-8')
        def classMap = [:]
        lines.each { line ->
            if (!line.startsWith('\t') && !line.trim().isEmpty() && !line.startsWith('tsrg2')) {
                def parts = line.trim().split('\\s+')
                if (parts.length >= 2) {
                    classMap[parts[0]] = parts[1]
                }
            }
        }
        def mapDescriptor = { String descriptor ->
            def result = new StringBuilder(descriptor.length())
            int index = 0
            while (index < descriptor.length()) {
                if (descriptor.charAt(index) == 'L') {
                    int end = descriptor.indexOf(';', index)
                    if (end < 0) {
                        result.append(descriptor.substring(index))
                        break
                    }
                    def owner = descriptor.substring(index + 1, end)
                    result.append('L').append(classMap.get(owner, owner)).append(';')
                    index = end + 1
                } else {
                    result.append(descriptor.charAt(index++))
                }
            }
            result.toString()
        }
        def outputLines = ['tsrg2 searge notch']
        lines.each { line ->
            if (line.startsWith('tsrg2') || line.trim().isEmpty()) {
                return
            }
            def parts = line.trim().split('\\s+')
            if (line.startsWith('\t')) {
                if (parts.length == 2) {
                    outputLines << "\t${parts[1]} ${parts[0]}"
                } else if (parts.length >= 3) {
                    outputLines << "\t${parts[2]} ${mapDescriptor(parts[1])} ${parts[0]}"
                }
            } else if (parts.length >= 2) {
                outputLines << "${parts[1]} ${parts[0]}"
            }
        }
        def outputFile = mixinMappingsFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(outputLines.join(System.lineSeparator()), 'UTF-8')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            "-AoutRefMapFile=${layout.buildDirectory.file('generated/mixin/advancedarmordamagelimit.refmap.json').get().asFile}",
            "-AreobfTsrgFile=${mixinMappingsFile.get().asFile}",
            '-AmappingTypes=tsrg',
            '-AdefaultObfuscationEnv=searge',
    ])
    dependsOn generateMixinMappings
}

tasks.named('processResources') {
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.file('generated/mixin/advancedarmordamagelimit.refmap.json'))
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF/licenses/advanced-armor-damage-limit'
    }
    from(rootProject.file('NOTICE.md')) {
        into 'META-INF'
    }
    from(rootProject.file('licenses/YiRanExpressionLib-LICENSE.txt')) {
        into 'META-INF/licenses/yiran-expression-lib'
    }
    from(rootProject.file('licenses/ArmorDamageLimit-MIT-LICENSE.txt')) {
        into 'META-INF/licenses/armor-damage-limit-original'
    }
}

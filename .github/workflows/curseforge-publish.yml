name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to publish, with or without a leading v
        required: true
        default: 1.0.1
        type: string
      target:
        description: Loader group or individual version to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge
          - fabric
          - forge-1.19.2
          - forge-1.20.1
          - neoforge-1.21.1
          - neoforge-1.26.1.2
          - fabric-1.21.1
      source_ref:
        description: Optional branch or ref override when one individual target is selected
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

jobs:
  forge-1-19-2:
    if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'forge' || inputs.target == 'forge-1.19.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'forge-1.19.2' && inputs.source_ref != '' && inputs.source_ref || 'forge-1.19.2' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare version
        run: |
          version="${RELEASE_VERSION#v}"
          test -n "$version"
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Verify artifact
        run: |
            expected="advanced-armor-damage-limit-forge-1.19.2-${CURSEFORGE_VERSION}-all.jar"
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=build/libs/$expected" >> "$GITHUB_ENV"
      - name: Prepare current changelog
        run: |
          version="${CURSEFORGE_VERSION}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md
      - name: Publish mod
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          version: ${{ env.CURSEFORGE_VERSION }}
            name: advanced-armor-damage-limit-forge-1.19.2-${{ env.CURSEFORGE_VERSION }}-all
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.19.2
          java: '17'

